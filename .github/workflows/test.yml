name: Runner Smoke Test for testing the connectivity

on:
  push:

jobs:
  test:
    runs-on: arc-runner-set

    steps:
      - uses: actions/checkout@v4

      - name: Hostname
        run: hostname

      - name: User
        run: whoami

      - name: Directory
        run: pwd
      
      - name: Show Docker Version
        run: docker --version

      - name: Show Git Version
        run: git --version